- name: Install ARM DS kiosk packages
  apt:
    name:
      - xrdp
      - chromium-browser
      - chromium-browser-l10n
      - chromium-codecs-ffmpeg
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Setup xrdp main config
  template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
  notify:
    - restart xrdp daemon

- name: Setup xrdp sesman config
  template:
    src: sesman.ini.j2
    dest: /etc/xrdp/sesman.ini
  notify:
    - restart xrdp-sesman daemon

- name: Setup user session script for xrdp
  template:
    src: startwm.sh.j2
    dest: /etc/xrdp/startwm.sh

- name: Setup user session reconnect script for xrdp
  template:
    src: reconnectwm.sh.j2
    dest: /etc/xrdp/reconnectwm.sh

