- name: Install ocservd requered packages
  apt:
    name:
      - libev4
      - libevent-2.1-7
      - libgmpxx4ldbl
      - libgnutls-dane0
      - libgnutls-openssl27
      - libgnutlsxx28
      - libtasn1-doc
      - libunbound8
      - krb5-multidev
      - libgssrpc4
      - libkadm5clnt-mit12
      - libkadm5srv-mit12
      - libkdb5-10
      - libnl-3-200
      - libnl-3-dev
      - libnl-route-3-200
      - libcjose0
      - libcurl3-gnutls
      - libjansson4
      - libnghttp2-14
      - librtmp1
      - libssh-4
      - libglib2.0-0
      - libglib2.0-data
      - libhttp-parser2.9
      - libicu70
      - libprotobuf-c1
      - libprotobuf23
      - libprotoc23
      - libtalloc2
      - libxml2
      - pkg-config
      - shared-mime-info
      - xdg-user-dirs
      - protobuf-c-compiler
      - gperf
      - libnss-wrapper
      - libpam-wrapper
      - libuid-wrapper
      - gss-ntlmssp
      - iputils-ping
      - libcap2-bin
      - libpam-cap
      - libsocket-wrapper
      - libtevent0
      - libwbclient0
      - gnutls-bin
      - iproute2
      - libatm1
      - libbpf0
      - libelf1
      - libmnl0
      - libxtables12
      - ssl-cert
      - dbus
      - libapparmor1
      - libdbus-1-3
      - libmaxminddb0
      - readline-common
      - libpcl1
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Copy ocserv deb package to host
  copy:
    src: ocserv_1.1.7-1_amd64.deb
    dest: /tmp/ocserv_1.1.7-1_amd64.deb

- name: Install ocserv deb package
  apt:
    deb: /tmp/ocserv_1.1.7-1_amd64.deb
    state: present
    update_cache: no
    cache_valid_time: 3600

- name: Install certbot packages
  apt:
    name:
      - certbot
    state: present
    update_cache: no
    cache_valid_time: 3600
    autoremove: yes


